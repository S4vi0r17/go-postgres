root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "tmp/api"
  include_ext = ["go"]
  exclude_dir  = ["tmp", "vendor", "testdata"]
  exclude_regex = ["_test.go"]
  delay = 1000       # ms before rebuild on change
  env_file = ".env"

[log]
  time = false

[color]
  main    = "magenta"
  watcher = "cyan"
  build   = "yellow"
  runner  = "green"

[misc]
  clean_on_exit = true  # remove tmp/ on Ctrl+C
